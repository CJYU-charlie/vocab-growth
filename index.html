<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>오늘의 어휘성장</title>

  <meta
    name="theme-color"
    content="#4c7f63"
  >

  <meta
    name="application-name"
    content="오늘의 어휘성장"
  >

  <meta
    name="mobile-web-app-capable"
    content="yes"
  >

  <meta
    name="apple-mobile-web-app-capable"
    content="yes"
  >

  <link
    rel="manifest"
    href="manifest.json"
  >

  <link
    rel="icon"
    type="image/png"
    sizes="192x192"
    href="icon-192.png"
  >

  <link
    rel="apple-touch-icon"
    href="icon-192.png"
  >

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Noto Sans KR",
        Arial,
        sans-serif;

      background: #f5faf6;
      color: #25342c;
    }

    .wrap {
      min-height: 100vh;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 24px;
    }

    .card {
      width: 100%;
      max-width: 430px;

      padding: 34px 26px;

      border-radius: 26px;

      background: #ffffff;

      text-align: center;

      box-shadow:
        0 10px 35px
        rgba(34, 65, 48, 0.10);
    }

    .icon {
      width: 132px;
      height: 132px;

      margin-bottom: 20px;

      border-radius: 30px;

      object-fit: cover;
    }

    h1 {
      margin: 0 0 12px;

      font-size: 30px;
      font-weight: 900;
    }

    .message {
      margin: 0 0 30px;

      color: #6a7971;

      font-size: 17px;
      line-height: 1.8;
    }

    .start-button {
      display: block;

      width: 100%;

      padding: 17px 20px;

      border: none;
      border-radius: 16px;

      background: #4c7f63;
      color: #ffffff;

      text-decoration: none;

      font-size: 18px;
      font-weight: 900;

      cursor: pointer;
    }

    .small {
      margin-top: 18px;

      color: #9aa59f;

      font-size: 12px;
    }

  </style>
</head>


<body>

  <main class="wrap">

    <div class="card">

      <img
        src="icon-512.png"
        alt="오늘의 어휘성장"
        class="icon"
      >

      <h1>
        오늘의 어휘성장
      </h1>

      <p class="message">
        오늘도 새로운 낱말을 만나고<br>
        이야기 속에서 뜻을 찾아볼까요?
      </p>

     <button
      id="startLearningBtn"
      class="start-button"
      type="button"
    >
      오늘 학습 시작하기
      </button>

      <button
        id="apiTestBtn"
        style="
          margin-top:16px;
          width:100%;
          padding:14px;
          border:none;
          border-radius:14px;
          background:#dfeee5;
          color:#345c47;
          font-size:16px;
          font-weight:800;
        "
      >
        API 연결 테스트
      </button>

      <div
        id="apiTestResult"
        style="
          margin-top:12px;
          font-size:14px;
          color:#65756c;
          line-height:1.6;
        "
      ></div>


      
      <div class="small">
        하루 약 30분 · 어휘 5개
      </div>

    </div>

  <section
  id="wordScreen"
  style="
    display:none;
    min-height:100vh;
    padding:32px 20px;
  "
>
  <div
    style="
      max-width:430px;
      margin:0 auto;
    "
  >

    <div
      style="
        text-align:center;
        margin-bottom:26px;
      "
    >
      <div
        style="
          font-size:15px;
          color:#6f7d75;
          margin-bottom:8px;
        "
      >
        오늘의 낱말
      </div>

      <h2
        style="
          margin:0;
          font-size:28px;
          font-weight:900;
        "
      >
        오늘 만날 어휘 5개
      </h2>
    </div>


    <div
      id="todayWords"
      style="
        display:grid;
        gap:12px;
      "
    ></div>


    <button
      id="backHomeBtn"
      type="button"
      style="
        margin-top:24px;
        width:100%;
        padding:15px;
        border:none;
        border-radius:14px;
        background:#e4eee8;
        color:#355b47;
        font-size:16px;
        font-weight:800;
        cursor:pointer;
      "
    >
      처음 화면으로
    </button>

  </div>
</section>
    
  </main>


  <script>

    const APPS_SCRIPT_API_URL =
      'https://script.google.com/macros/s/AKfycbwV4WTSh0cGwUc9DYSajDK7YKlJBVI08UhWV95ZJaNaB_72TVdXxgbXTbjPV120oeUz/exec';


    document
      .getElementById('startLearningBtn')
      .addEventListener(
        'click',
        async function() {

          const button =
            document.getElementById(
              'startLearningBtn'
            );

          button.disabled = true;

          button.textContent =
            '오늘 학습을 준비하고 있어요...';

          try {

            const response =
              await fetch(
                APPS_SCRIPT_API_URL +
                '?api=today'
              );

            if (!response.ok) {
              throw new Error(
                'API 응답 오류'
              );
            }
    
            const data =
              await response.json();
    
    
            if (
              !data.words ||
              !Array.isArray(data.words)
            ) {
              throw new Error(
                '어휘 데이터를 찾을 수 없습니다.'
              );
            }
    
    
            renderTodayWords(
              data.words
            );
    
    
            document
              .querySelector('.wrap')
              .style.display =
                'none';
    
    
            document
              .getElementById(
                'wordScreen'
              )
              .style.display =
                'block';
    
    
            window.scrollTo(
              0,
              0
            );
    
          }
    
          catch (error) {
    
            alert(
              '오늘 학습을 불러오지 못했어요.\n\n' +
              error.message
            );
    
          }
    
          finally {
    
            button.disabled = false;
    
            button.textContent =
              '오늘 학습 시작하기';
    
          }
    
        }
      );
    
    
    
      function renderTodayWords(
      words
    ) {
    
      const container =
        document.getElementById(
          'todayWords'
        );
    
    
      container.innerHTML =
        '';
    
    
      words.forEach(
        function(word, index) {
    
          const card =
            document.createElement(
              'div'
            );
    
    
          card.style.cssText = `
            padding:20px;
            border-radius:18px;
            background:#ffffff;
            box-shadow:
              0 5px 18px
              rgba(40,70,54,0.08);
          `;
    
    
          card.innerHTML = `
            <div
              style="
                display:flex;
                align-items:center;
                justify-content:space-between;
                gap:12px;
              "
            >
    
              <div>
    
                <div
                  style="
                    margin-bottom:5px;
                    color:#839087;
                    font-size:13px;
                    font-weight:700;
                  "
                >
                  ${index + 1}번째 낱말
                </div>
    
                <div
                  style="
                    font-size:25px;
                    font-weight:900;
                    color:#26362e;
                  "
                >
                  ${escapeHtml(word.word)}
                </div>
    
              </div>
    
    
              <div
                style="
                  padding:7px 12px;
                  border-radius:999px;
                  background:#edf5f0;
                  color:#466b57;
                  font-size:14px;
                  font-weight:800;
                "
              >
                ${escapeHtml(word.subject)}
              </div>
    
            </div>
          `;
    
    
          container.appendChild(
            card
          );
    
        }
      );
    
    }
    
    
    
    function escapeHtml(
      text
    ) {
    
      return String(text)
    
        .replace(/&/g, '&amp;')
    
        .replace(/</g, '&lt;')
    
        .replace(/>/g, '&gt;')
    
        .replace(/"/g, '&quot;')
    
        .replace(/'/g, '&#039;');
    
    }
    
    
    
    document
      .getElementById('backHomeBtn')
      .addEventListener(
        'click',
        function() {
    
          document
            .getElementById(
              'wordScreen'
            )
            .style.display =
              'none';
    
    
          document
            .querySelector(
              '.wrap'
            )
            .style.display =
              'flex';
    
    
          window.scrollTo(
            0,
            0
          );
    
        }
      );

    /*
     * service worker 등록
     */
    if ('serviceWorker' in navigator) {

      window.addEventListener(
        'load',
        function() {

          navigator.serviceWorker
            .register('./sw.js');

        }
      );

    }

    document
      .getElementById('apiTestBtn')
      .addEventListener(
        'click',
        async function() {

          const resultBox =
            document.getElementById(
              'apiTestResult'
            );

          resultBox.textContent =
            '연결을 확인하고 있어요...';

          try {

            const response =
              await fetch(
                'https://script.google.com/macros/s/AKfycbwV4WTSh0cGwUc9DYSajDK7YKlJBVI08UhWV95ZJaNaB_72TVdXxgbXTbjPV120oeUz/exec?api=ping'
              );

            const data =
              await response.json();

            resultBox.textContent =
              data.message;

          }

          catch (error) {

            resultBox.textContent =
              '연결 실패: ' +
              error.message;

          }

        }
      );
    
  </script>

</body>
</html>
