  <style>

.doneStep {

}

<body>

    <!-- 낱말 카드 -->

    >

        "

      </div>


      <div
        id="wordSubject"
        style="
          padding:7px 14px;
          border-radius:999px;
          background:#e5f0e9;
          color:#3f6952;
          font-size:14px;
          font-weight:900;
        "
      >
      </div>


      <div
        style="
          margin-top:28px;
          text-align:center;
          font-size:17px;
          line-height:1.7;

        "
      >
        뜻을 보기 전에 먼저 생각해 보세요.<br>
        이 낱말을 얼마나 알고 있나요?
      </div>

    </div>


    <!-- 자기평가 -->
    <div

        margin:26px 0 14px;

        font-weight:900;
      "

      지금 내 생각과 가장 가까운 것을 골라보세요.

    <div

    >

      <button
        id="familiarBtn"

      </button>

      <button
        id="newBtn"

        onclick="selectSelfCheck('new')"
      >
        😶 처음 보는 것 같아요
      </button>

    </div>


    <button
      id="nextWordBtn"
      type="button"
      onclick="nextWord()"
      style="
        margin-top:24px;
        width:100%;
        min-height:58px;

        background:#4c7f63;
        color:white;

        font-weight:900;

      "
    >
      다음 낱말 →
    </button>


    <button
      type="button"
      onclick="backToHome()"
      style="

    >

</section>

<section

  style="

    min-height:100vh;
    padding:32px 20px;
  "
>
  <div
    style="
      max-width:640px;
      margin:0 auto;
    "
  >

    <!-- 상단 단계 표시 -->
    <div
      style="
        display:flex;
        justify-content:space-between;
        margin-bottom:34px;
      "
    >
      <div style="text-align:center;width:20%;">
        <div class="stepDot doneStep">1</div>
        <div class="stepLabel doneLabel">낱말</div>
      </div>

      <div style="text-align:center;width:20%;">
        <div
          style="
            width:28px;
            height:28px;
            margin:0 auto 6px;
            border-radius:50%;
            background:#4c7f63;
            color:white;
            display:flex;
            align-items:center;
            justify-content:center;
            font-weight:900;
          "
        >
          2
        </div>

        <div
          style="
            font-size:12px;
            font-weight:800;
            color:#4c7f63;
          "
        >
          읽기
        </div>
      </div>

      <div style="text-align:center;width:20%;">
        <div class="stepDot">3</div>
        <div class="stepLabel">문제</div>
      </div>

      <div style="text-align:center;width:20%;">
        <div class="stepDot">4</div>
        <div class="stepLabel">표현</div>
      </div>

      <div style="text-align:center;width:20%;">
        <div class="stepDot">5</div>
        <div class="stepLabel">완료</div>
      </div>
    </div>


    <div
      style="
        text-align:center;

      "
    >
      <div
        style="
          font-size:14px;
          color:#738178;
          margin-bottom:8px;
          font-weight:800;
        "
      >
        오늘의 읽기
      </div>

      <h2
        id="readingTitle"
        style="
          margin:0;
          font-size:28px;
          font-weight:900;
          line-height:1.4;
        "
      >
      </h2>
    </div>


    <!-- 지문 -->
    <div
      id="readingText"
      style="
        padding:24px 22px;
        border-radius:20px;
        background:#ffffff;
        border:1px solid #dfe8e3;

        font-size:17px;
        line-height:1.95;

        color:#2b3931;

        white-space:pre-line;

        box-shadow:
          0 5px 18px

      "
    >
    </div>


    <button
      type="button"
      onclick="goToQuestions()"

    </button>


    <button

  </main>


  <script>

    const APPS_SCRIPT_API_URL =
      'https://script.google.com/macros/s/AKfycbwV4WTSh0cGwUc9DYSajDK7YKlJBVI08UhWV95ZJaNaB_72TVdXxgbXTbjPV120oeUz/exec';

    let learningData = null;

    let currentWordIndex = 0;
  
    let selfChecks = [];

    
    document
      .getElementById('startLearningBtn')
      .addEventListener(
        'click',
        async function(event) {

          event.preventDefault();
          event.stopPropagation();

          const button =
            document.getElementById(
              'startLearningBtn'
            );

          button.disabled = true;

          button.textContent =
            '오늘 학습을 준비하고 있어요...';

          try {

            const response =
              await fetch(
                APPS_SCRIPT_API_URL +
                '?api=today'
              );

            if (!response.ok) {
              throw new Error(
                'API 응답 오류'
              );
            }
    
            const data =
              await response.json();
    
    
            if (
              !data.words ||
              !Array.isArray(data.words)
            ) {
              throw new Error(
                '어휘 데이터를 찾을 수 없습니다.'
              );
            }
    
    
            learningData = data;

            currentWordIndex = 0;

            selfChecks = [];

            renderCurrentWord();
    
    
            document
              .querySelector('.card')
              .style.display =
                'none';
    
    
            document
              .getElementById(
                'wordScreen'
              )
              .style.display =
                'block';
    
    
            window.scrollTo(
              0,
              0
            );
    
          }
    
          catch (error) {
    
            alert(
              '오늘 학습을 불러오지 못했어요.\n\n' +
              error.message
            );
    
          }
    
          finally {
    
            button.disabled = false;
    
            button.textContent =
              '오늘 학습 시작하기';
    
          }
    
        }
      );
    


      function renderCurrentWord() {

  const word =
    learningData.words[
      currentWordIndex
    ];

  document
    .getElementById(
      'wordCounter'
    )
    .textContent =
      (currentWordIndex + 1) +
      ' / ' +
      learningData.words.length;


  document
    .getElementById(
      'wordMain'
    )
    .textContent =
      word.word;


  document
    .getElementById(
      'wordSubject'
    )
    .textContent =
      word.subject;


  clearSelfCheckButtons();


  const saved =
    selfChecks[
      currentWordIndex
    ];

  if (saved) {
    selectSelfCheck(
      saved,
      false
    );
  }


  const nextButton =
    document.getElementById(
      'nextWordBtn'
    );


  if (
    currentWordIndex ===
    learningData.words.length - 1
  ) {

    nextButton.textContent =
      '낱말 확인 완료 →';

  } else {

    nextButton.textContent =
      '다음 낱말 →';

  }

} 

function clearSelfCheckButtons() {

  [
    'knowBtn',
    'familiarBtn',
    'newBtn'
  ].forEach(
    function(id) {

      document
        .getElementById(id)
        .classList.remove(
          'selected'
        );

    }
  );

}



function selectSelfCheck(
  value,
  save = true
) {

  clearSelfCheckButtons();


  const buttonMap = {

    know:
      'knowBtn',

    familiar:
      'familiarBtn',

    new:
      'newBtn'

  };


  document
    .getElementById(
      buttonMap[value]
    )
    .classList.add(
      'selected'
    );


  if (save) {

    selfChecks[
      currentWordIndex
    ] = value;

  }

}    


function nextWord() {

  if (
    !selfChecks[
      currentWordIndex
    ]
  ) {

    alert(
      '이 낱말을 얼마나 알고 있는지 먼저 골라 주세요.'
    );

    return;

  }


  if (
    currentWordIndex <
    learningData.words.length - 1
  ) {

    currentWordIndex++;

    renderCurrentWord();

    window.scrollTo(
      0,
      0
    );

    return;

  }

showReadingScreen();
 

}    


function backToHome() {

  document
    .getElementById(
      'wordScreen'
    )
    .style.display =
      'none';


  document
    .querySelector(
      '.card'
    )
    .style.display =
      'block';


  window.scrollTo(
    0,
    0
  );

}    
    
    
    

    
    
    
    function escapeHtml(
      text
    ) {
    
      return String(text)
    
        .replace(/&/g, '&amp;')
    
        .replace(/</g, '&lt;')
    
        .replace(/>/g, '&gt;')
    
        .replace(/"/g, '&quot;')
    
        .replace(/'/g, '&#039;');
    
    }
    
 function showReadingScreen() {

  const reading =
    learningData.reading;

  document
    .getElementById(
      'readingTitle'
    )
    .textContent =
      reading.title;


  document
    .getElementById(
      'readingText'
    )
    .textContent =
      reading.text;


  document
    .getElementById(
      'wordScreen'
    )
    .style.display =
      'none';


  document
    .getElementById(
      'readingScreen'
    )
    .style.display =
      'block';


  window.scrollTo(
    0,
    0
  );

}   

function backToWords() {

  document
    .getElementById(
      'readingScreen'
    )
    .style.display =
      'none';


  document
    .getElementById(
      'wordScreen'
    )
    .style.display =
      'block';


  renderCurrentWord();


  window.scrollTo(
    0,
    0
  );

}    
    
function goToQuestions() {

  alert(
    '읽기 단계까지 정상적으로 완료했어요!\n\n' +
    '다음 단계에서 6문제 화면을 연결할 거예요.'
  );

}

    

    /*
     * service worker 등록
     */
    if ('serviceWorker' in navigator) {

      window.addEventListener(
        'load',
        function() {

          navigator.serviceWorker
            .register('./sw.js');

        }
      );

    }

    document
      .getElementById('apiTestBtn')
      .addEventListener(
        'click',
        async function() {

          const resultBox =
            document.getElementById(
              'apiTestResult'
            );

          resultBox.textContent =
            '연결을 확인하고 있어요...';

          try {

            const response =
              await fetch(
                'https://script.google.com/macros/s/AKfycbwV4WTSh0cGwUc9DYSajDK7YKlJBVI08UhWV95ZJaNaB_72TVdXxgbXTbjPV120oeUz/exec?api=ping'
              );

            const data =
              await response.json();

            resultBox.textContent =
              data.message;

          }

          catch (error) {

            resultBox.textContent =
              '연결 실패: ' +
              error.message;

          }

        }
      );
    
  </script>

</body>
